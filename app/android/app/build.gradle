plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Load the upload-keystore properties (gitignored). Falls back to debug
// signing if the file is absent so local `flutter run --release` still works.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "co.za.sanlam.sanlam_chronic"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "co.za.sanlam.sanlam_chronic"
        minSdk = 26
        // Play Store requires targetSdk 36+ for app updates from Aug 31, 2026.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Two distribution variants:
    //   sideload  → keeps REQUEST_INSTALL_PACKAGES so the side-loaded APK
    //               can self-update from app.sanlamallianz4u.co.ug/download.
    //   playstore → drops REQUEST_INSTALL_PACKAGES (handled by Play Store).
    flavorDimensions += "distribution"
    productFlavors {
        sideload {
            dimension = "distribution"
            // default — same behaviour as before flavors existed.
        }
        playstore {
            dimension = "distribution"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // Provides enableEdgeToEdge() used in MainActivity.kt
    implementation 'androidx.activity:activity-ktx:1.9.3'
}
